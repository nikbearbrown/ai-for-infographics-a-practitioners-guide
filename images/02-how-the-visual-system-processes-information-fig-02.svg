<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg"><rect width="700" height="420" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
<marker id="arrowred" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C8102E"/></marker></defs>
<text x="32" y="36" font-family="'EB Garamond', Georgia, serif" font-size="18" fill="#2a1a0e">The legend tax: a lookup table the eye must re-fetch</text>
<text x="32" y="54" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">DIRECT LABELS DELETE THE TABLE — SPATIAL CONTIGUITY RETURNS THE CAPACITY</text>

<!-- LEFT panel: legend with shuttle -->
<rect x="32" y="72" width="300" height="300" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
<text x="48" y="96" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">SEPARATED LEGEND</text>
<!-- stacked bands -->
<rect x="56" y="116" width="150" height="32" fill="#2a1a0e"/>
<rect x="56" y="148" width="150" height="32" fill="#545454"/>
<rect x="56" y="180" width="150" height="32" fill="#ADADAD"/>
<rect x="56" y="212" width="150" height="32" fill="#D4D4D4"/>
<!-- legend box, far from bands -->
<rect x="232" y="116" width="84" height="128" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
<rect x="240" y="124" width="12" height="12" fill="#2a1a0e"/><text x="258" y="134" font-family="'Inter', Helvetica, sans-serif" font-size="10" fill="#2a1a0e">Coal</text>
<rect x="240" y="148" width="12" height="12" fill="#545454"/><text x="258" y="158" font-family="'Inter', Helvetica, sans-serif" font-size="10" fill="#2a1a0e">Gas</text>
<rect x="240" y="172" width="12" height="12" fill="#ADADAD"/><text x="258" y="182" font-family="'Inter', Helvetica, sans-serif" font-size="10" fill="#2a1a0e">Wind</text>
<rect x="240" y="196" width="12" height="12" fill="#D4D4D4"/><text x="258" y="206" font-family="'Inter', Helvetica, sans-serif" font-size="10" fill="#2a1a0e">Solar</text>
<!-- shuttle arrows (red accent = manufactured load) -->
<line x1="232" y1="132" x2="208" y2="132" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowred)"/>
<line x1="208" y1="164" x2="232" y2="160" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowred)"/>
<line x1="232" y1="194" x2="208" y2="196" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowred)"/>
<text x="48" y="300" font-family="'EB Garamond', Georgia, serif" font-size="13" fill="#C8102E">+ working-memory re-fetch on every glance</text>
<text x="48" y="320" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#545454">Six color-to-category bindings, held and re-fetched.</text>

<!-- RIGHT panel: direct labels -->
<rect x="368" y="72" width="300" height="300" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
<text x="384" y="96" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">DIRECT LABELS IN PLACE</text>
<rect x="392" y="116" width="180" height="32" fill="#2a1a0e"/><text x="402" y="137" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#FFFFFF">Coal</text>
<rect x="392" y="148" width="150" height="32" fill="#2a1a0e"/><text x="402" y="169" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#FFFFFF">Gas</text>
<rect x="392" y="180" width="96" height="32" fill="#2a1a0e"/><text x="402" y="201" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#FFFFFF">Wind</text>
<rect x="392" y="212" width="64" height="32" fill="#2a1a0e"/><text x="402" y="233" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#FFFFFF">Solar</text>
<text x="384" y="300" font-family="'EB Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">0 lookups — contiguity satisfied</text>
<text x="384" y="320" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#545454">The label sits on the thing it labels.</text>
</svg>
