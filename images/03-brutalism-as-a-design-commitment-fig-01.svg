<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg"><rect width="700" height="420" fill="#FFFFFF"/>
<defs><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter></defs>
<text x="32" y="36" font-family="'EB Garamond', Georgia, serif" font-size="18" fill="#2a1a0e">The blur test: what survives an honest hierarchy</text>
<text x="32" y="54" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">THREE THINGS SHOULD SURVIVE — HEADLINE, MAIN VISUAL, PRIMARY ANNOTATION</text>

<!-- LEFT panel: sharp -->
<rect x="32" y="72" width="300" height="300" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
<text x="48" y="96" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">SHARP — ALL MARKS PRESENT</text>
<g>
<!-- gridlines (light) -->
<line x1="56" y1="150" x2="308" y2="150" stroke="#D4D4D4" stroke-width="0.75"/>
<line x1="56" y1="200" x2="308" y2="200" stroke="#D4D4D4" stroke-width="0.75"/>
<line x1="56" y1="250" x2="308" y2="250" stroke="#D4D4D4" stroke-width="0.75"/>
<!-- headline -->
<text x="56" y="124" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#2a1a0e">Model B wins</text>
<!-- bars -->
<rect x="80" y="200" width="44" height="100" fill="#2a1a0e"/>
<rect x="148" y="150" width="44" height="150" fill="#2a1a0e"/>
<rect x="216" y="240" width="44" height="60" fill="#2a1a0e"/>
<line x1="56" y1="300" x2="308" y2="300" stroke="#2a1a0e" stroke-width="2"/>
<!-- annotation -->
<text x="56" y="328" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#2a1a0e">+50% over baseline</text>
<!-- decorative flourish (should NOT survive) -->
<text x="240" y="120" font-family="'Inter', Helvetica, sans-serif" font-size="22" fill="#D4D4D4">★</text>
</g>

<!-- RIGHT panel: blurred -->
<rect x="368" y="72" width="300" height="300" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
<text x="384" y="96" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">BLURRED — ONLY WEIGHT SURVIVES</text>
<g filter="url(#blur)">
<line x1="392" y1="150" x2="644" y2="150" stroke="#D4D4D4" stroke-width="0.75"/>
<line x1="392" y1="200" x2="644" y2="200" stroke="#D4D4D4" stroke-width="0.75"/>
<text x="392" y="124" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#2a1a0e">Model B wins</text>
<rect x="416" y="200" width="44" height="100" fill="#2a1a0e"/>
<rect x="484" y="150" width="44" height="150" fill="#C8102E"/>
<rect x="552" y="240" width="44" height="60" fill="#2a1a0e"/>
<line x1="392" y1="300" x2="644" y2="300" stroke="#2a1a0e" stroke-width="2"/>
<text x="392" y="328" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#2a1a0e">+50% over baseline</text>
<text x="576" y="120" font-family="'Inter', Helvetica, sans-serif" font-size="22" fill="#D4D4D4">★</text>
</g>
<!-- survivor checklist -->
<text x="384" y="348" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#2a1a0e">Survives: headline · tallest bar · annotation.</text>
<text x="384" y="364" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1px" fill="#545454">GRIDLINES &amp; FLOURISH DISSOLVE — IT PASSES</text>
</svg>
