<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg"><rect width="700" height="420" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker></defs>
<text x="32" y="36" font-family="'EB Garamond', Georgia, serif" font-size="18" fill="#2a1a0e">One file, three readers</text>
<text x="32" y="54" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">RENDERS CORRECTLY AND STAYS EDITABLE — ONLY THE HUMAN RECONCILES THEM</text>

<!-- shared file -->
<rect x="280" y="70" width="140" height="36" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
<text x="350" y="93" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2a1a0e">&lt;svg&gt; · one file</text>
<!-- branch arrows -->
<line x1="310" y1="106" x2="146" y2="134" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="106" x2="350" y2="134" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390" y1="106" x2="554" y2="134" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- BROWSER -->
<rect x="32" y="140" width="200" height="150" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
<text x="48" y="164" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">BROWSER</text>
<text x="48" y="184" font-family="'EB Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">Rendering instruction</text>
<text x="48" y="212" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#2a1a0e">Cares: valid raster</text>
<text x="48" y="234" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#545454">Ignores: group names</text>
<text x="48" y="252" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#545454">Ignores: live vs. outlined text</text>
<text x="48" y="276" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1px" fill="#545454">DOES IT PAINT?</text>

<!-- GENERATOR -->
<rect x="250" y="140" width="200" height="150" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
<text x="266" y="164" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">CODE GENERATOR</text>
<text x="266" y="184" font-family="'EB Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">Serialization target</text>
<text x="266" y="212" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#2a1a0e">Cares: easy to produce</text>
<text x="266" y="234" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#545454">Ignores: editability</text>
<text x="266" y="252" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#545454">Emits: flat &lt;g&gt; of paths</text>
<text x="266" y="276" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1px" fill="#545454">WHAT SERIALIZES?</text>

<!-- DESIGNER -->
<rect x="468" y="140" width="200" height="150" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
<text x="484" y="164" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#545454">DESIGNER</text>
<text x="484" y="184" font-family="'EB Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">Structured document</text>
<text x="484" y="212" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#2a1a0e">Needs: named layers</text>
<text x="484" y="234" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#2a1a0e">Needs: live text</text>
<text x="484" y="252" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#545454">Hates: clipping masks</text>
<text x="484" y="276" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1px" fill="#545454">CAN I EDIT IT?</text>

<!-- arrows into reconciliation -->
<line x1="132" y1="290" x2="250" y2="322" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="290" x2="350" y2="322" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="568" y1="290" x2="450" y2="322" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- reconciliation band (red accent) -->
<rect x="32" y="328" width="636" height="62" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
<text x="48" y="350" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1px" fill="#C8102E">THE RECONCILIATION — IRREDUCIBLY HUMAN</text>
<text x="48" y="374" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#2a1a0e">Semantic ids · live text · released masks: renders correctly AND stays editable.</text>
</svg>
