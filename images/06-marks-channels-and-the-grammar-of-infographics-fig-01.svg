<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <!-- Title -->
  <text x="32" y="40" font-family="EB Garamond, Georgia, serif" font-size="18" fill="#2a1a0e">The Cleveland&#8211;McGill accuracy ladder</text>
  <text x="32" y="60" font-family="Inter, sans-serif" font-size="12" fill="#545454">How accurately the eye decodes a quantity from each channel</text>

  <!-- Accuracy axis arrow -->
  <line x1="56" y1="92" x2="56" y2="372" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="100" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454" transform="rotate(-90 40 235)">MORE ACCURATE &#8594; LESS ACCURATE</text>

  <!-- Ladder rungs -->
  <!-- Rung 1: position (RED accent) -->
  <rect x="80" y="92" width="430" height="34" fill="#C8102E"/>
  <text x="92" y="114" font-family="EB Garamond, Georgia, serif" font-size="14" fill="#FFFFFF">1 &#183; Position along a common scale</text>
  <text x="640" y="114" font-family="JetBrains Mono, monospace" font-size="10" fill="#2a1a0e" text-anchor="end">BARS, DOTS</text>

  <!-- Rung 2 -->
  <rect x="80" y="132" width="392" height="30" fill="#2a1a0e"/>
  <text x="92" y="152" font-family="EB Garamond, Georgia, serif" font-size="13" fill="#FFFFFF">2 &#183; Position, non-aligned scales</text>
  <text x="640" y="152" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454" text-anchor="end">SMALL MULTIPLES</text>

  <!-- Rung 3 -->
  <rect x="80" y="168" width="346" height="30" fill="#2a1a0e"/>
  <text x="92" y="188" font-family="EB Garamond, Georgia, serif" font-size="13" fill="#FFFFFF">3 &#183; Length</text>
  <text x="640" y="188" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454" text-anchor="end">STACKED SEGMENTS</text>

  <!-- Rung 4 -->
  <rect x="80" y="204" width="300" height="30" fill="#545454"/>
  <text x="92" y="224" font-family="EB Garamond, Georgia, serif" font-size="13" fill="#FFFFFF">4 &#183; Angle / slope</text>
  <text x="640" y="224" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454" text-anchor="end">PIE WEDGES</text>

  <!-- Rung 5 -->
  <rect x="80" y="240" width="252" height="30" fill="#545454"/>
  <text x="92" y="260" font-family="EB Garamond, Georgia, serif" font-size="13" fill="#FFFFFF">5 &#183; Area</text>
  <text x="640" y="260" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454" text-anchor="end">BUBBLES, TREEMAP</text>

  <!-- Rung 6 -->
  <rect x="80" y="276" width="200" height="30" fill="#D4D4D4"/>
  <text x="92" y="296" font-family="EB Garamond, Georgia, serif" font-size="13" fill="#2a1a0e">6 &#183; Volume / curvature</text>
  <text x="640" y="296" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454" text-anchor="end">3-D CHARTS</text>

  <!-- Rung 7 -->
  <rect x="80" y="312" width="150" height="30" fill="#D4D4D4"/>
  <text x="92" y="332" font-family="EB Garamond, Georgia, serif" font-size="13" fill="#2a1a0e">7 &#183; Color hue / saturation</text>
  <text x="640" y="332" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454" text-anchor="end">HEAT MAP AS NUMBERS</text>

  <!-- Annotation: the rule -->
  <text x="80" y="372" font-family="Inter, sans-serif" font-size="11" fill="#545454">For quantitative comparison, climb toward the top &#8212; hue is at the bottom, which is why the system rations it to one accent.</text>
</svg>
