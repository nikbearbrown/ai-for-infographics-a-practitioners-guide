<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="420" fill="#FFFFFF"/>

  <text x="32" y="40" font-family="EB Garamond, Georgia, serif" font-size="18" fill="#2a1a0e">Seven tokens, each with a role</text>
  <text x="32" y="60" font-family="Inter, sans-serif" font-size="12" fill="#545454">Color is a typed system: every use carries information or competes with it</text>

  <!-- Token rows -->
  <g font-family="JetBrains Mono, monospace" font-size="10">
    <!-- white -->
    <rect x="32" y="82" width="36" height="30" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="80" y="96" fill="#2a1a0e" font-family="EB Garamond, Georgia, serif" font-size="13">white #FFFFFF</text>
    <text x="80" y="108" fill="#545454">CANVAS</text>
    <!-- ink -->
    <rect x="32" y="118" width="36" height="30" fill="#2a1a0e"/>
    <text x="80" y="132" fill="#2a1a0e" font-family="EB Garamond, Georgia, serif" font-size="13">ink #2a1a0e</text>
    <text x="80" y="144" fill="#545454">TEXT, STRUCTURE, DATA</text>
    <!-- red (RED accent — single data accent) -->
    <rect x="32" y="154" width="36" height="30" fill="#C8102E"/>
    <text x="80" y="168" fill="#C8102E" font-family="EB Garamond, Georgia, serif" font-size="13">red #C8102E</text>
    <text x="80" y="180" fill="#C8102E">THE ONE DATA ACCENT &#8212; ONCE PER FIGURE</text>
    <!-- grey -->
    <rect x="32" y="190" width="36" height="30" fill="#545454"/>
    <text x="80" y="204" fill="#2a1a0e" font-family="EB Garamond, Georgia, serif" font-size="13">grey #545454</text>
    <text x="80" y="216" fill="#545454">CAPTIONS, AXIS LABELS</text>
    <!-- light grey -->
    <rect x="32" y="226" width="36" height="30" fill="#D4D4D4"/>
    <text x="80" y="240" fill="#2a1a0e" font-family="EB Garamond, Georgia, serif" font-size="13">light grey #D4D4D4</text>
    <text x="80" y="252" fill="#545454">GRIDLINES, HAIRLINES</text>
    <!-- ochre (NEVER DATA) -->
    <rect x="32" y="262" width="36" height="30" fill="#C8860E"/>
    <text x="80" y="276" fill="#2a1a0e" font-family="EB Garamond, Georgia, serif" font-size="13">ochre #C8860E</text>
    <text x="80" y="288" fill="#2a1a0e" font-weight="700">STRUCTURE &#8212; NEVER DATA</text>
    <!-- panel -->
    <rect x="32" y="298" width="36" height="30" fill="#F5F5F5" stroke="#D4D4D4"/>
    <text x="80" y="312" fill="#2a1a0e" font-family="EB Garamond, Georgia, serif" font-size="13">panel #F5F5F5</text>
    <text x="80" y="324" fill="#545454">PLOT-REGION BACKGROUND</text>
  </g>

  <!-- Ochre flag underline -->
  <rect x="32" y="293" width="280" height="2" fill="#C8860E"/>

  <!-- RIGHT: luminance ladder -->
  <text x="400" y="96" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454">LUMINANCE LADDER (GRAYSCALE-STABLE)</text>
  <g>
    <rect x="400" y="110" width="220" height="30" fill="#2a1a0e"/><text x="410" y="130" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF">ink &#8212; darkest</text>
    <rect x="400" y="144" width="220" height="30" fill="#C8102E"/><text x="410" y="164" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF">red &#8212; "the dark one that isn't black"</text>
    <rect x="400" y="178" width="220" height="30" fill="#545454"/><text x="410" y="198" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF">grey &#8212; mid</text>
    <rect x="400" y="212" width="220" height="30" fill="#D4D4D4"/><text x="410" y="232" font-family="Inter, sans-serif" font-size="11" fill="#2a1a0e">light grey</text>
    <rect x="400" y="246" width="220" height="30" fill="#F5F5F5" stroke="#D4D4D4"/><text x="410" y="266" font-family="Inter, sans-serif" font-size="11" fill="#2a1a0e">panel &#8212; lightest</text>
  </g>
  <text x="400" y="300" font-family="Inter, sans-serif" font-size="11" fill="#2a1a0e">A single red accent survives grayscale</text>
  <text x="400" y="315" font-family="Inter, sans-serif" font-size="11" fill="#2a1a0e">conversion as a distinct dark step.</text>

  <text x="32" y="360" font-family="Inter, sans-serif" font-size="11" fill="#545454">The moment ochre encodes a value, the reader loses the ability to tell structure from signal.</text>
  <text x="32" y="378" font-family="Inter, sans-serif" font-size="11" fill="#545454">Two data-encoding colors maximum; never lean on opacity, which stacks silently and collapses in grayscale.</text>
</svg>
