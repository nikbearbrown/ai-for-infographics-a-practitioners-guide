<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <!-- title -->
  <text x="32" y="38" font-family="EB Garamond, Georgia, serif" font-size="18" fill="#2a1a0e">Source of truth vs. derived artifact</text>
  <text x="32" y="58" font-family="Inter, sans-serif" font-size="11" fill="#545454">The audit marks each file before any one is privileged. Editing a derived artifact fixes nothing.</text>

  <!-- ===== SOURCE → DERIVED chain ===== -->
  <!-- SOURCE -->
  <rect x="44" y="120" width="170" height="92" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="60" y="146" font-family="EB Garamond, Georgia, serif" font-size="15" fill="#2a1a0e">regional-lending.svg</text>
  <text x="60" y="168" font-family="JetBrains Mono, monospace" font-size="10" fill="#2a1a0e">SOURCE OF TRUTH</text>
  <text x="60" y="186" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">Records the decisions.</text>
  <text x="60" y="201" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">Edit HERE.</text>

  <!-- arrow source -> derived -->
  <line x1="214" y1="166" x2="296" y2="166" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="255" y="158" font-family="JetBrains Mono, monospace" font-size="9" fill="#545454" text-anchor="middle">RASTERIZE</text>

  <!-- DERIVED -->
  <rect x="300" y="120" width="170" height="92" fill="#FFFFFF" stroke="#D4D4D4"/>
  <text x="316" y="146" font-family="EB Garamond, Georgia, serif" font-size="15" fill="#545454">regional-lending.png</text>
  <text x="316" y="168" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454">DERIVED ARTIFACT</text>
  <text x="316" y="186" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">Downstream of decisions.</text>
  <text x="316" y="201" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">Regenerate; never edit.</text>

  <!-- futile edit on the PNG (dead end) -->
  <path d="M540 130 Q 560 166 540 202" fill="none" stroke="#D4D4D4" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="478" y="166" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">"fix the PNG"</text>
  <line x1="556" y1="150" x2="572" y2="182" stroke="#545454" stroke-width="1.6"/>
  <line x1="572" y1="150" x2="556" y2="182" stroke="#545454" stroke-width="1.6"/>
  <text x="578" y="170" font-family="JetBrains Mono, monospace" font-size="9" fill="#545454">FIXES NOTHING</text>

  <!-- ===== QUARANTINE (isolated, below) ===== -->
  <rect x="44" y="262" width="426" height="96" fill="#F5F5F5" stroke="#C8102E" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="62" y="290" font-family="EB Garamond, Georgia, serif" font-size="15" fill="#2a1a0e">final_v2_REAL_fixed.svg</text>
  <text x="62" y="312" font-family="JetBrains Mono, monospace" font-size="10" fill="#C8102E">UNKNOWN PROVENANCE — QUARANTINE</text>
  <text x="62" y="332" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">No record of what it claims or who last touched it.</text>
  <text x="62" y="348" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">DO NOT BUILD ON IT. Regenerate fresh against a complete DESIGN.md.</text>

  <!-- red do-not-build marker -->
  <circle cx="420" cy="310" r="22" fill="none" stroke="#C8102E" stroke-width="2.4"/>
  <line x1="404" y1="294" x2="436" y2="326" stroke="#C8102E" stroke-width="2.4"/>

  <!-- footnote / legend -->
  <text x="32" y="386" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">Taking attendance before privileging any one file is the discipline the "cleanest-looking file" reach violates.</text>
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#545454">
    <circle cx="40" cy="404" r="6" fill="none" stroke="#C8102E" stroke-width="2"/>
    <text x="52" y="408">RED = THE QUARANTINE MARKER (DO NOT BUILD ON)</text>
  </g>
</svg>
