<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <!-- title -->
  <text x="32" y="38" font-family="EB Garamond, Georgia, serif" font-size="18" fill="#2a1a0e">The one-way ticket</text>
  <text x="32" y="58" font-family="Inter, sans-serif" font-size="11" fill="#545454">Each SVG&#8596;Illustrator round trip re-wraps groups in new anonymous parents; nesting compounds geometrically.</text>

  <!-- ===== TOP PATH: disciplined one-way ===== -->
  <text x="32" y="92" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454">DISCIPLINED — IMPORT ONCE</text>

  <g font-family="Inter, sans-serif" font-size="10.5" fill="#2a1a0e">
    <rect x="32" y="104" width="92" height="40" fill="#F5F5F5" stroke="#D4D4D4"/>
    <text x="78" y="124" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="12">SVG</text>
    <text x="78" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454">spec-driven</text>

    <rect x="168" y="104" width="92" height="40" fill="#F5F5F5" stroke="#D4D4D4"/>
    <text x="214" y="124" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="12">IMPORT</text>
    <text x="214" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454">once</text>

    <rect x="304" y="104" width="92" height="40" fill="#F5F5F5" stroke="#D4D4D4"/>
    <text x="350" y="124" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="12">CORRECT</text>
    <text x="350" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454">clips · names</text>

    <rect x="440" y="104" width="92" height="40" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.5"/>
    <text x="486" y="124" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="12">.ai</text>
    <text x="486" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454">shallow · clean</text>
  </g>
  <g stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arrow)" fill="none">
    <path d="M124 124 H 164"/>
    <path d="M260 124 H 300"/>
    <path d="M396 124 H 436"/>
  </g>
  <!-- clean shallow nest sample -->
  <rect x="548" y="104" width="120" height="40" fill="none" stroke="#2a1a0e"/>
  <rect x="558" y="112" width="100" height="24" fill="none" stroke="#545454"/>
  <text x="608" y="128" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454">DEPTH 2</text>

  <!-- divider -->
  <line x1="32" y1="168" x2="668" y2="168" stroke="#D4D4D4"/>

  <!-- ===== BOTTOM PATH: repeated round trips → exponential nesting ===== -->
  <text x="32" y="194" font-family="JetBrains Mono, monospace" font-size="10" fill="#545454">REPEATED ROUND TRIPS — NESTING GROWS 1 &#8594; 2 &#8594; 4 &#8594; 8</text>

  <!-- four growing nested-box stacks -->
  <!-- trip 1 : depth 1 -->
  <g>
    <rect x="40" y="216" width="50" height="50" fill="none" stroke="#545454"/>
    <text x="65" y="284" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454">TRIP 1</text>
    <text x="65" y="296" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454">d=1</text>
  </g>
  <!-- trip 2 : depth 2 -->
  <g>
    <rect x="150" y="216" width="62" height="62" fill="none" stroke="#545454"/>
    <rect x="160" y="226" width="42" height="42" fill="none" stroke="#545454"/>
    <text x="181" y="296" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454">TRIP 2 · d=2</text>
  </g>
  <!-- trip 3 : depth 4 -->
  <g>
    <rect x="272" y="216" width="78" height="78" fill="none" stroke="#545454"/>
    <rect x="282" y="226" width="58" height="58" fill="none" stroke="#545454"/>
    <rect x="292" y="236" width="38" height="38" fill="none" stroke="#545454"/>
    <rect x="302" y="246" width="18" height="18" fill="none" stroke="#545454"/>
    <text x="311" y="308" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454">TRIP 3 · d=4</text>
  </g>
  <!-- trip 4 : depth 8 (runaway) — RED ACCENT -->
  <g>
    <rect x="412" y="212" width="98" height="98" fill="none" stroke="#C8102E" stroke-width="1.4"/>
    <rect x="420" y="220" width="82" height="82" fill="none" stroke="#C8102E" stroke-width="1.3"/>
    <rect x="428" y="228" width="66" height="66" fill="none" stroke="#C8102E" stroke-width="1.2"/>
    <rect x="436" y="236" width="50" height="50" fill="none" stroke="#C8102E" stroke-width="1.1"/>
    <rect x="444" y="244" width="34" height="34" fill="none" stroke="#C8102E"/>
    <rect x="452" y="252" width="18" height="18" fill="none" stroke="#C8102E"/>
    <text x="461" y="326" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#C8102E">TRIP 4 · d=8 · UNNAVIGABLE</text>
  </g>

  <!-- regenerate-from-spec loop (the cheap alternative) -->
  <path d="M548 250 q 60 -34 0 -68" fill="none" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="600" y="200" font-family="Inter, sans-serif" font-size="10.5" fill="#2a1a0e" text-anchor="middle">Need a change?</text>
  <text x="600" y="214" font-family="Inter, sans-serif" font-size="10.5" fill="#2a1a0e" text-anchor="middle">Fix the SPEC,</text>
  <text x="600" y="228" font-family="Inter, sans-serif" font-size="10.5" fill="#2a1a0e" text-anchor="middle">regenerate the SVG.</text>
  <text x="600" y="266" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454" text-anchor="middle">REGEN IS CHEAP;</text>
  <text x="600" y="278" font-family="JetBrains Mono, monospace" font-size="8" fill="#545454" text-anchor="middle">FIGHTING NESTING IS NOT.</text>

  <!-- footnote / legend -->
  <text x="32" y="360" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">Illustrator is treated as a one-way ticket: SVG generated once, imported once, corrected once, saved as .ai.</text>
  <text x="32" y="376" font-family="Inter, sans-serif" font-size="10.5" fill="#545454">Structural changes go back to the specification — never re-export from Illustrator and re-import.</text>
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#C8102E">
    <rect x="32" y="392" width="12" height="12" fill="none" stroke="#C8102E" stroke-width="1.4"/>
    <text x="50" y="402">RED = THE RUNAWAY ANONYMOUS-WRAPPER NEST (THE FAILURE WARNED AGAINST)</text>
  </g>
</svg>
